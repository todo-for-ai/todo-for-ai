[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
priority=10

[program:flask]
command=gunicorn --bind 0.0.0.0:50110 --workers 4 --timeout 120 --worker-class sync --preload app:app
directory=/app
user=appuser
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/flask.err.log
stdout_logfile=/var/log/supervisor/flask.out.log
environment=FLASK_APP="app.py",FLASK_ENV="production",PORT="50110",HOST="0.0.0.0"
priority=20


