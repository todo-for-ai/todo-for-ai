version: '3.8'

services:
  # 数据库服务
  mysql:
    image: mysql:8.0
    container_name: todo-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: todo_for_ai
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - todo-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend-prod
    environment:
      # Flask配置
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      
      # 数据库配置
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/todo_for_ai
      
      # Auth0配置
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_CALLBACK_URL: https://${DOMAIN}/todo-for-ai/api/v1/auth/callback
      
      # JWT配置
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      
      # CORS配置
      ALLOWED_ORIGINS: https://${DOMAIN}
      
      # 端口配置
      PORT: 50110
    ports:
      - "50110:50110"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - todo-network
    volumes:
      - ./backend/uploads:/app/uploads

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${DOMAIN}/todo-for-ai/api/v1
    container_name: todo-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - todo-network
    volumes:
      - ./ssl:/etc/nginx/ssl:ro  # SSL证书目录

volumes:
  mysql_data:

networks:
  todo-network:
    driver: bridge
