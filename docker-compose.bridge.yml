version: '3.8'

# Todo for AI - Docker Compose 配置 (Bridge 网络模式)
# 此配置文件使用 bridge 网络模式，与 docker run 方式兼容

services:
  todo-for-ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:50110/todo-for-ai/api/v1
        VITE_MCP_SERVER_URL: http://localhost:50110
        VITE_APP_TITLE: "Todo for AI"
        VITE_APP_VERSION: "1.0.0"
    
    container_name: todo-for-ai-app
    
    # 端口映射 (bridge 网络模式)
    ports:
      - "50111:80"       # 前端 (nginx)
      - "50110:50110"    # 后端 API
    
    # 网络配置 - 添加 host.docker.internal 支持
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # 环境变量配置
    environment:
      # ==================== 基础 Flask 配置 ====================
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PORT=50110
      - HOST=0.0.0.0
      - DOCKER_ENV=true

      # ==================== 应用运行配置 ====================
      - DEBUG=False
      - TESTING=False

      # ==================== 数据库配置 ====================
      # 数据库连接字符串 (使用 host.docker.internal 连接宿主机数据库)
      - DATABASE_URL=mysql+pymysql://root:YOUR_DB_PASSWORD@host.docker.internal:3306/todo_for_ai

      # ==================== 安全配置 ====================
      # 生产环境必须更改这些密钥
      - SECRET_KEY=CHANGE-THIS-SECRET-KEY-IN-PRODUCTION-2024
      - JWT_SECRET_KEY=CHANGE-THIS-JWT-SECRET-KEY-IN-PRODUCTION-2024

      # ==================== OAuth 第三方登录配置 ====================
      # GitHub OAuth 应用配置 (可选)
      - GITHUB_CLIENT_ID=YOUR_GITHUB_CLIENT_ID_HERE
      - GITHUB_CLIENT_SECRET=YOUR_GITHUB_CLIENT_SECRET_HERE
      - GITHUB_REDIRECT_URI=http://localhost:50110/todo-for-ai/api/v1/auth/github/callback

      # Google OAuth 应用配置 (可选)
      - GOOGLE_CLIENT_ID=YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=YOUR_GOOGLE_CLIENT_SECRET_HERE

      # ==================== CORS 跨域配置 ====================
      - CORS_ORIGINS=http://localhost:5173,http://localhost:50111,http://localhost:50112,http://localhost:8080

      # ==================== 文件上传配置 ====================
      - UPLOAD_FOLDER=/app/uploads
      - MAX_CONTENT_LENGTH=16777216

      # ==================== 日志配置 ====================
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/app.log

      # ==================== SSL/TLS 配置 ====================
      - PYTHONHTTPSVERIFY=0
      - REQUESTS_CA_BUNDLE=""

    # 卷挂载
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50110/todo-for-ai/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 重启策略
    restart: unless-stopped
    
    # 标签
    labels:
      - "com.todo-for-ai.description=Todo for AI Application"
      - "com.todo-for-ai.version=1.0.0"
      - "com.todo-for-ai.network=bridge"
