version: '3.8'

services:
  todo-for-ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:50110/todo-for-ai/api/v1
        VITE_MCP_SERVER_URL: http://localhost:50110
        VITE_APP_TITLE: "Todo for AI"
        VITE_APP_VERSION: "1.0.0"
    
    container_name: todo-for-ai-app
    
    # 网络配置 - 使用host网络模式以访问宿主机数据库
    network_mode: host
    
    # 环境变量
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PORT=50110
      - HOST=0.0.0.0
      # 数据库连接使用宿主机地址
      - DATABASE_URL=mysql+pymysql://root:cC11001100@host.docker.internal:3306/todo_for_ai
      - SECRET_KEY=docker-secret-key-change-in-production-2024
      - JWT_SECRET_KEY=docker-jwt-secret-key-change-in-production-2024
      - UPLOAD_FOLDER=/app/uploads
      - MAX_CONTENT_LENGTH=16777216
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/app.log
      - PYTHONHTTPSVERIFY=0
      - REQUESTS_CA_BUNDLE=""
      # GitHub OAuth 配置 (可选，如果不使用GitHub登录可以设置为空)
      - GITHUB_CLIENT_ID=""
      - GITHUB_CLIENT_SECRET=""
      - GITHUB_REDIRECT_URI=""

    # 端口映射
    ports:
      - "8080:80"        # 前端 (nginx)
      - "50110:50110"    # 后端 API

    # 卷挂载
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50110/todo-for-ai/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 重启策略
    restart: unless-stopped
    
    # 依赖关系 - 确保宿主机MySQL服务运行
    depends_on: []
    
    # 标签
    labels:
      - "com.todo-for-ai.description=Todo for AI Application"
      - "com.todo-for-ai.version=1.0.0"
